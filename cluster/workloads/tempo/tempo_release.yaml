apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: observability
spec:
  interval: 5m
  chart:
    spec:
      chart: tempo-distributed
      version: "1.61.3"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 1h
  # The single-node cluster cannot schedule old and new gateway pods together
  # because the previous chart applied hard pod anti-affinity. Recreate avoids
  # deadlocking Helm's rollout while preserving the single gateway replica.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: tempo-gateway
            patch: |
              - op: add
                path: /spec/strategy
                value:
                  type: Recreate
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    global:
      extraEnvFrom:
        - secretRef:
            name: tempo-minio-user
      extraArgs:
        - "-config.expand-env=true"

    tempo:
      structuredConfig:
        storage:
          trace:
            backend: s3
            s3:
              endpoint: minio.minio.svc.cluster.local:80
              bucket: tempo-blocks
              insecure: true
              access_key: ${access_key}
              secret_key: ${secret_key}
        distributor:
          receivers:
            otlp:
              protocols:
                http:
                  endpoint: 0.0.0.0:4318
                grpc:
                  endpoint: 0.0.0.0:4317
        ingester:
          lifecycler:
            ring:
              replication_factor: 1
          max_block_bytes: 104857600
          max_block_duration: 5m
        compactor:
          compaction:
            # Keep migrated and new traces for five years.
            block_retention: 43800h
        query_frontend:
          mcp_server:
            enabled: true
          metrics:
            # Allow TraceQL metrics range queries over a full day.
            max_duration: 24h
        usage_report:
          reporting_enabled: false
        overrides:
          defaults:
            metrics_generator:
              processors:
                - local-blocks
        cache: null

    memcached:
      enabled: false

    serviceAccount:
      create: true

    distributor:
      replicas: 1
      affinity: ""

    ingester:
      replicas: 1
      affinity: ""

    compactor:
      replicas: 1
      affinity: ""

    querier:
      replicas: 1
      affinity: ""

    queryFrontend:
      replicas: 1
      affinity: ""
      extraArgs:
        - "-config.expand-env=true"

    queryScheduler:
      enabled: true
      replicas: 1

    gateway:
      enabled: true
      replicas: 1
      affinity: ""
      service:
        type: ClusterIP

    metricsGenerator:
      enabled: true
      replicas: 1
      affinity: ""
      walEmptyDir: {}
      extraArgs:
        - "-config.expand-env=true"
      extraEnvFrom:
        - secretRef:
            name: tempo-minio-user
      config:
        # Temporary 31-day acceptance window permits rebuilding TraceQL metrics
        # from the sealed migration archives without replaying traces into the
        # ingester. Revert this slack after the backfill is flushed.
        metrics_ingestion_time_range_slack: 744h
        processor:
          local_blocks:
            filter_server_spans: false
            flush_to_storage: true
            flush_check_period: 1s
            max_block_duration: 1m

    metaMonitoring:
      serviceMonitor:
        enabled: false
