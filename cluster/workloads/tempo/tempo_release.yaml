apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: observability
spec:
  interval: 5m
  chart:
    spec:
      chart: tempo-distributed
      version: "1.48.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    global:
      extraEnvFrom:
        - secretRef:
            name: tempo-minio-user
      extraArgs:
        - "-config.expand-env=true"

    tempo:
      structuredConfig:
        storage:
          trace:
            backend: s3
            s3:
              endpoint: minio.minio.svc.cluster.local:80
              bucket: tempo-blocks
              insecure: true
              access_key: ${access_key}
              secret_key: ${secret_key}
        distributor:
          receivers:
            otlp:
              protocols:
                http:
                  endpoint: 0.0.0.0:4318
                grpc:
                  endpoint: 0.0.0.0:4317
        ingester:
          lifecycler:
            ring:
              replication_factor: 1
          max_block_bytes: 104857600
          max_block_duration: 5m
        compactor:
          compaction:
            # Keep migrated and new traces for five years.
            block_retention: 43800h
        usage_report:
          reporting_enabled: false
        overrides:
          defaults:
            metrics_generator:
              processors:
                - local-blocks
        cache: null

    memcached:
      enabled: false

    serviceAccount:
      create: true

    distributor:
      replicas: 1
      affinity: ""

    ingester:
      replicas: 1
      affinity: ""

    compactor:
      replicas: 1
      affinity: ""

    querier:
      replicas: 1
      affinity: ""

    queryFrontend:
      replicas: 1
      affinity: ""
      extraArgs:
        - "-config.expand-env=true"

    queryScheduler:
      enabled: true
      replicas: 1

    gateway:
      enabled: true
      replicas: 1
      service:
        type: ClusterIP

    metricsGenerator:
      enabled: true
      replicas: 1
      affinity: ""
      walEmptyDir: {}
      extraArgs:
        - "-config.expand-env=true"
      extraEnvFrom:
        - secretRef:
            name: tempo-minio-user
      config:
        processor:
          local_blocks: {}

    metaMonitoring:
      serviceMonitor:
        enabled: false
