apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: strimzi-kafka-operator
  namespace: kafka
spec:
  interval: 5m
  chart:
    spec:
      chart: strimzi-kafka-operator
      version: "1.1.0"
      sourceRef:
        kind: HelmRepository
        name: strimzi
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    replicas: 1
    watchNamespaces:
      - kafka
    watchAnyNamespace: false
    podDisruptionBudget:
      enabled: false
