apiVersion: v1
kind: ConfigMap
metadata:
  name: host-telemetry-agent
  namespace: observability
data:
  config.yaml: |
    receivers:
      hostmetrics:
        root_path: /hostfs
        collection_interval: 30s
        scrapers:
          cpu:
            metrics:
              system.cpu.utilization:
                enabled: true
              system.cpu.logical.count:
                enabled: true
          disk: {}
          load: {}
          filesystem:
            exclude_mount_points:
              mount_points:
                - /dev/*
                - /proc/*
                - /sys/*
                - /run/k3s/containerd/*
                - /var/lib/docker/*
                - /var/lib/kubelet/*
                - /snap/*
              match_type: regexp
            exclude_fs_types:
              fs_types:
                - autofs
                - binfmt_misc
                - bpf
                - cgroup2
                - configfs
                - debugfs
                - devpts
                - devtmpfs
                - fusectl
                - hugetlbfs
                - iso9660
                - mqueue
                - nsfs
                - overlay
                - proc
                - procfs
                - pstore
                - rpc_pipefs
                - securityfs
                - selinuxfs
                - squashfs
                - sysfs
                - tracefs
              match_type: strict
          memory:
            metrics:
              system.memory.utilization:
                enabled: true
              system.memory.limit:
                enabled: true
          network: {}
          paging:
            metrics:
              system.paging.usage:
                enabled: true
          processes: {}
          system:
            metrics:
              system.uptime:
                enabled: true

    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      resource/host:
        attributes:
          - key: host.name
            value: ${env:K8S_NODE_NAME}
            action: upsert
      transform/promote_metric_attributes:
        metric_statements:
          - set(datapoint.attributes["host.name"], resource.attributes["host.name"])
      batch:
        send_batch_size: 2048
        timeout: 5s

    exporters:
      prometheusremotewrite/mimir:
        endpoint: http://mimir-nginx.observability.svc.cluster.local/api/v1/push
        resource_to_telemetry_conversion:
          enabled: true
        remote_write_queue:
          enabled: true
          queue_size: 10000
          num_consumers: 2
        retry_on_failure:
          enabled: true

    service:
      pipelines:
        metrics:
          receivers: [hostmetrics]
          processors: [memory_limiter, resource/host, transform/promote_metric_attributes, batch]
          exporters: [prometheusremotewrite/mimir]
      telemetry:
        logs:
          level: info
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: host-telemetry-agent
  namespace: observability
spec:
  selector:
    matchLabels:
      app: host-telemetry-agent
  template:
    metadata:
      labels:
        app: host-telemetry-agent
      annotations:
        telemetry.rafaeltab.com/config-revision: "2"
    spec:
      hostPID: true
      containers:
        - name: otelcol
          image: otel/opentelemetry-collector-contrib:0.147.0
          args: ["--config=/etc/otelcol/config.yaml"]
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
            - name: hostfs
              mountPath: /hostfs
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: host-telemetry-agent
        - name: hostfs
          hostPath:
            path: /
            type: Directory
