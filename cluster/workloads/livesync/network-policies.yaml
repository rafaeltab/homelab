apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: livesync
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: couchdb-ingress
  namespace: livesync
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: couchdb
      app.kubernetes.io/part-of: livesync
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: traefik-kube-system
              app.kubernetes.io/name: traefik
      ports:
        - port: 5984
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: livesync-bootstrap
              app.kubernetes.io/part-of: livesync
      ports:
        - port: 5984
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bootstrap-egress
  namespace: livesync
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: livesync-bootstrap
      app.kubernetes.io/part-of: livesync
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: couchdb
              app.kubernetes.io/part-of: livesync
      ports:
        - port: 5984
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
