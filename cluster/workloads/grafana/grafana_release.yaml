apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: observability
spec:
  interval: 5m
  chart:
    spec:
      chart: grafana
      version: "9.2.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    admin:
      existingSecret: grafana-admin-credentials
      userKey: admin-user
      passwordKey: admin-password

    persistence:
      enabled: true
      storageClassName: zfs-local-persistent
      size: 2Gi

    # The single-node ReadWriteOnce PVC cannot be mounted by old and new pods concurrently.
    deploymentStrategy:
      type: Recreate

    service:
      type: ClusterIP

    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Mimir
            uid: mimir
            type: prometheus
            access: proxy
            url: http://mimir-nginx.observability.svc.cluster.local/prometheus
            isDefault: true
            editable: false
          - name: Loki
            uid: loki
            type: loki
            access: proxy
            url: http://loki-gateway.observability.svc.cluster.local
            editable: false
          - name: Tempo
            uid: tempo
            type: tempo
            access: proxy
            url: http://tempo-gateway.observability.svc.cluster.local
            editable: false
            jsonData:
              tracesToMetrics:
                datasourceUid: mimir
              tracesToLogs:
                datasourceUid: loki
              serviceMap:
                datasourceUid: mimir

    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: kubernetes
            orgId: 1
            folder: ""
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/kubernetes
          - name: general
            orgId: 1
            folder: ""
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/general
          - name: hermes
            orgId: 1
            folder: Hermes
            folderUid: hermes
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/hermes

    ingress:
      enabled: true
      ingressClassName: "traefik"
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
      hosts:
        - grafana.homelab1.local.rafaeltab.com
      tls:
        - hosts:
            - "grafana.homelab1.local.rafaeltab.com"
          secretName: grafana-homelab1-local-rafaeltab-com-tls

    dashboardsConfigMaps:
      kubernetes: grafana-dashboards-kubernetes
      general: grafana-dashboards-general
      hermes: grafana-dashboards-hermes
