apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: strimzi
  namespace: flux-system
spec:
  interval: 15m
  path: ./cluster/workloads/strimzi
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: namespaces
    - name: helm-repositories
