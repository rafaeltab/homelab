apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: k8s-monitoring
  namespace: flux-system
spec:
  interval: 15m
  path: ./cluster/workloads/k8s-monitoring
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: namespaces
    - name: helm-repositories
    - name: mimir
