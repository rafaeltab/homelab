apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wallpaperdb-ci-events
  namespace: flux-system
spec:
  interval: 15m
  path: ./cluster/workloads/wallpaperdb-ci-events
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: namespaces
    - name: loki
